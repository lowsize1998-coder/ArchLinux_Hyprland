
# Dreamcore lock screen. Authentication behavior stays native.
background {
    monitor =
    color = rgba(194B66ff)
}
input-field {
    monitor =
    size = 260, 48
    outline_thickness = 2
    inner_color = rgba(FFE2E6ff)
    outer_color = rgba(FDE1BAff)
    font_color = rgba(1B272Cff)
    check_color = rgba(9381C5ff)
    fail_color = rgba(840E1Cff)
    placeholder_text = <i>Пароль</i>
    fail_text = <b>Повторите ввод ($ATTEMPTS)</b>
    rounding = 10
    position = 0, -40
    halign = center
    valign = center
}
label {
    monitor =
    text = $TIME
    color = rgba(FAEEBAff)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 180
    halign = center
    valign = center
}
auth {
    fingerprint:enabled = false
}
